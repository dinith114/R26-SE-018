<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Farm Simulator — digital twin</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:100%;height:100%;overflow:hidden;background:#0b1220;font-family:sans-serif;color:#e2e8f0}
 #wrap{display:flex;width:100%;height:100%}
 #view{flex:1;position:relative;min-width:0}
 #side{width:390px;max-width:44%;background:#111a2b;border-left:1px solid #223049;display:flex;flex-direction:column}
 h1{font-size:15px;padding:12px 14px 6px}
 #ctl{padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:6px}
 .b{background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:7px;padding:7px 11px;font-size:12px;cursor:pointer}
 .b.on{background:#16a34a;color:#fff;border-color:#16a34a;font-weight:700}
 .b.stop{background:#b91c1c;border-color:#b91c1c;color:#fff}
 #clock{padding:0 14px 8px;display:flex;align-items:baseline;gap:10px}
 #time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
 #day{font-size:12px;color:#94a3b8}
 #body{flex:1;overflow-y:auto;padding:0 14px 14px}
 .card{background:#16223a;border-radius:9px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #334155}
 .card.dry{border-left-color:#f59e0b}.card.ok{border-left-color:#22c55e}.card.cool{border-left-color:#38bdf8}
 .nm{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
 .tagx{font-size:9px;font-weight:800;padding:2px 6px;border-radius:9px}
 .vals{display:flex;gap:10px;margin-top:5px;font-size:11.5px;color:#a8b6cc;font-variant-numeric:tabular-nums;flex-wrap:wrap}
 .traybar{height:7px;background:#0b1220;border-radius:4px;margin-top:6px;overflow:hidden}
 .trayfill{height:100%;background:#38bdf8;border-radius:4px;transition:width .3s}
 .lbl{font-size:10px;color:#64748b;margin-top:3px}
 #log{font-size:11px;line-height:1.5;color:#94a3b8;max-height:150px;overflow-y:auto;background:#0d1524;border-radius:8px;padding:8px;margin-top:6px}
 #log b{color:#4ade80}.err{color:#f87171}.cmd{color:#fbbf24}
 h2{font-size:12px;color:#64748b;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
 #hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#ffffff33;font-size:11px}
 #status{position:absolute;top:10px;left:12px;background:rgba(0,0,0,.55);border-radius:8px;padding:7px 11px;font-size:12px}
 label{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:5px;cursor:pointer}
 @media(max-width:820px){#wrap{flex-direction:column}#side{width:100%;max-width:100%;height:52%;border-left:none;border-top:1px solid #223049}}
</style>
</head>
<body>
<div id="wrap">
 <div id="view">
   <div id="status">☀️ <span id="sunlbl">—</span></div>
   <div id="hint">drag to turn · scroll to zoom</div>
 </div>
 <div id="side">
   <h1>🌱 Live Farm Simulator <span style="font-size:11px;color:#64748b">digital twin</span></h1>
   <div id="clock"><div id="time">--:--</div><div id="day">Day 1</div></div>
   <div id="ctl">
     <button class="b on" id="run">⏸ Pause</button>
     <button class="b on" disabled title="Readings are stamped with the real clock. Fast-forward was removed: it wrote future-dated data over the live farm.">⏱ Real time</button>
     <button class="b stop" id="reset">↺ Reset</button>
   </div>
   <div style="padding:0 14px 8px"><label><input type="checkbox" id="autoML" checked> Auto-run ML (like a scheduler)</label></div>
   <div id="body">
     <h2>Sections</h2><div id="cards"></div>
     <h2>Activity</h2><div id="log"></div>
   </div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ══════════════ CONFIG ══════════════ */
const FB  = 'https://orchid-smart-care-default-rtdb.firebaseio.com';
const API  = 'http://127.0.0.1:8000/api/v2/care';   // backend (for auto ML)
const AUTO = 'http://127.0.0.1:8000/api/v2/auto';   // the automation engine
const HOUSE = 'H1';

/* Each section = one microclimate. These offsets create the uneven-sun problem. */
const SECTIONS = [
  { id:'S1', name:'Section 1', label:'bright south edge', expo:1.00, tOff: 1.8, rhOff:-8, x:-7 },
  { id:'S2', name:'Section 2', label:'open west side',    expo:0.75, tOff: 1.0, rhOff:-4, x:-2.4 },
  { id:'S3', name:'Section 3', label:'shaded corner',     expo:0.45, tOff:-0.8, rhOff: 4, x: 2.4 },
  { id:'S4', name:'Section 4', label:'back wall corner',  expo:0.35, tOff:-1.2, rhOff: 6, x: 7 },
];

const TRAY_MAX = 3.0;        // cm — overflow notch height
const PUSH_EVERY_SEC = 60;      // real seconds between pushes
const BASE_T = 28.5, T_AMP = 5.5, BASE_RH = 72, RH_AMP = 14, LIGHT_MAX = 15000;

/* ══════════════ STATE ══════════════ */
/* REAL TIME. There is no fast-forward any more, and that is deliberate.
   This simulator used to run a virtual clock at 1 sim-minute per real second,
   seeded at 2026-08-21. Left open in a tab it reached 2027 and stamped every
   reading with a future date. The backend's freshness took the newest reading
   on the farm as "now", so that one future timestamp aged EVERY other section
   by 163 days: the fabricated data read "just now" while the real sensor node
   read "stale". Timestamps now come straight from the wall clock, so what this
   writes can never be newer than real time. */
let day = 1, running = true;
let simMin, simEpoch;                   // set from the clock every tick
let lastPushAt = 0, lastTrayCheckAt = 0, lastPlanDay = 0;

function nowMinutesOfDay(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
}
simMin = nowMinutesOfDay();
simEpoch = Date.now();

/* Sections a REAL node owns. The simulator must never write these - two writers
   on one section is precisely what put simulated data on top of live sensor
   readings. Re-read every 30 s, so linking a node in the app takes effect here
   without a reload. */
let REAL_SECTIONS = new Set();
async function refreshRealSections(){
  try{
    const r = await fetch(`${FB}/devices.json`);
    const d = (await r.json()) || {};
    const owned = new Set();
    for(const mac in d){
      const a = (d[mac]||{}).assignedTo;
      if(!a) continue;
      const [h, sec] = a.split('/');
      if(h === HOUSE && sec) owned.add(sec);
    }
    if([...owned].join() !== [...REAL_SECTIONS].join())
      log(`🔌 real nodes own: ${owned.size ? [...owned].join(', ') : '(none)'} - not simulated`);
    REAL_SECTIONS = owned;
  }catch(e){ /* keep the previous set rather than trampling a real node */ }
}
const S = {};
SECTIONS.forEach(s => S[s.id] = {
  ...s, temp:24, rh:80, light:0, tray:TRAY_MAX*0.6,
  waterBoost:0, spray:0, filling:0, fert:0, lastCmdTs:0, status:'-', pushOk:null,
});

function log(msg, cls=''){
  const el=document.getElementById('log');
  const t=fmt(simMin);
  el.innerHTML = `<div class="${cls}">[${t}] ${msg}</div>` + el.innerHTML;
  if(el.children.length>60) el.removeChild(el.lastChild);
}
const fmt = m => String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(Math.floor(m)%60).padStart(2,'0');

/* ══════════════ PHYSICS ══════════════ */
function stepPhysics(dtSimMin){
  const h = (simMin/60)%24;
  const sun = (h>=6 && h<=18) ? Math.max(0,Math.sin(Math.PI*(h-6)/12)) : 0;
  document.getElementById('sunlbl').textContent =
    sun>0.7?'strong sun':sun>0.3?'moderate sun':sun>0?'weak sun':'night';

  for(const k in S){
    const s = S[k];
    // ambient from time of day + this section's exposure
    s.temp  = BASE_T + T_AMP*Math.sin(2*Math.PI*(h-9)/24) + s.tOff*sun + (Math.random()-.5)*.3;
    s.light = LIGHT_MAX*sun*s.expo*(0.85+Math.random()*0.15);

    // tray evaporates faster when hot+bright  (surface area fixed → depth doesn't change rate)
    const evapRate = (0.004 + 0.010*sun) * (1 + Math.max(0,s.temp-30)*0.06); // cm per sim-min
    if(s.tray > 0) s.tray = Math.max(0, s.tray - evapRate*dtSimMin);

    // humidity: base cycle + tray contribution (only if tray has water) + watering decay
    const trayBoost = s.tray > 0.05 ? 9 : 0;
    s.waterBoost = Math.max(0, s.waterBoost - 0.35*dtSimMin);   // spray effect fades
    s.rh = BASE_RH - RH_AMP*Math.sin(2*Math.PI*(h-9)/24) + s.rhOff*sun
           + trayBoost + s.waterBoost + (Math.random()-.5)*1.5;
    s.rh = Math.max(30, Math.min(97, s.rh));
    s.temp = Math.round(s.temp*10)/10; s.rh = Math.round(s.rh*10)/10;
    s.light = Math.round(s.light);

    if(s.spray>0)   s.spray   = Math.max(0, s.spray - dtSimMin);
    if(s.filling>0){ s.filling = Math.max(0, s.filling - dtSimMin);
                     s.tray = Math.min(TRAY_MAX, s.tray + 0.6*dtSimMin); }  // notch caps it
    if(s.fert>0)    s.fert    = Math.max(0, s.fert - dtSimMin);
  }
}

const vpd = (t,rh)=> Math.round(0.6108*Math.exp(17.27*t/(t+237.3))*(1-rh/100)*1000)/1000;

/* ══════════════ ACT LIKE THE ESP32 ══════════════ */
async function pushReadings(){
  const now = Math.round(simEpoch);
  let wrote = 0;
  for(const k in S){
    const s = S[k];
    if(REAL_SECTIONS.has(s.id)){ s.pushOk = null; s.status = 'real node'; continue; }
    const payload = { temperature:s.temp, humidity:s.rh, light:s.light,
      vpd:vpd(s.temp,s.rh), sampleMoisture:Math.round((35+s.tray*12+Math.random()*6)*10)/10,
      timestamp:now, timestampIso:new Date(now).toISOString().slice(0,16).replace('T',' ') };
    const base = `${FB}/farm/houses/${HOUSE}/sections/${s.id}`;
    // history lives on its own branch so /farm/houses.json stays small — see
    // the note in the firmware; the app polls that path every 15 seconds
    const hist = `${FB}/farm/history/${HOUSE}/${s.id}`;
    try{
      await fetch(`${base}/latest.json`, {method:'PUT', body:JSON.stringify(payload)});
      await fetch(`${hist}.json`,        {method:'POST',body:JSON.stringify(payload)});
      s.pushOk = true; wrote++;
    }catch(e){ s.pushOk = false; }
  }
  log(`📡 pushed ${wrote} simulated section${wrote===1?'':'s'} to Firebase` +
      (REAL_SECTIONS.size ? ` (${REAL_SECTIONS.size} left to the real node)` : ''));
}

/* Poll for commands the app/backend wrote — exactly what the firmware does. */
async function pollCommands(){
  for(const k in S){
    const s = S[k];
    if(REAL_SECTIONS.has(s.id)) continue;   // the physical node executes its own
    const base = `${FB}/farm/houses/${HOUSE}/sections/${s.id}/control`;
    try{
      const r = await fetch(`${base}.json`); const c = await r.json();
      if(!c) continue;

      const w = c.waterCommand;
      if(w && w.requested){
        s.spray = Math.max(8, (w.durationSec||45)/60*8);
        s.waterBoost += 12;
        if(w.withFertilizer) { s.fert = 10; log(`🧪 ${s.name}: fertilizer mixed into water`, 'cmd'); }
        log(`💦 ${s.name}: WATER ${w.durationSec}s (by ${w.triggeredBy})`, 'cmd');
        await fetch(`${base}/waterCommand.json`,{method:'PUT',
          body:JSON.stringify({...w, requested:false, status:'done'})});
      }
      const t = c.trayCommand;
      if(t && t.requested){
        s.filling = Math.max(6,(t.fillSeconds||15)/60*10);
        log(`🪣 ${s.name}: FILL TRAY ${t.fillSeconds}s (by ${t.triggeredBy})`, 'cmd');
        await fetch(`${base}/trayCommand.json`,{method:'PUT',
          body:JSON.stringify({...t, requested:false, status:'done'})});
      }
    }catch(e){}
  }
}

/* Drive the REAL automation engine, at simulated time.
   This used to re-implement the scheduler here in the browser, which meant the
   simulator tested a copy of the logic rather than the code that actually runs
   the farm - and never exercised the watering link at all. Now it calls the
   engine's own pass and simply tells it what time to pretend it is. */
async function autoML(){
  if(!document.getElementById('autoML').checked) return;
  const t  = new Date(simEpoch);
  const at = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-`
           + `${String(t.getDate()).padStart(2,'0')} `
           + `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  try{
    const r = await fetch(`${AUTO}/engine/run-now?at=${encodeURIComponent(at)}`,{method:'POST'});
    if(r.ok){
      /* The engine is multi-tenant now: `did` arrives keyed by tenant, as
         { t_abc: { plan, tray, water } }, not the flat shape these lines were
         written for. Unflattened, every check below is undefined and the log
         goes quiet while the backend is in fact watering. Tolerant of both
         shapes so this page still works against a pre-cutover backend. */
      const rawDid = (await r.json()).did || {};
      const tids = Object.keys(rawDid).filter(k =>
        k.startsWith('t_') && rawDid[k] && typeof rawDid[k] === 'object');
      const d = {};
      if(!tids.length){ Object.assign(d, rawDid); }
      else { tids.forEach(t => Object.assign(d, rawDid[t])); }
      if(d.plan)  log(`🧠 <b>engine planned ${d.plan.planned} sections</b>`);
      if(d.water && d.water.watered && d.water.watered.length)
        log(`💧 <b>engine watered: ${d.water.watered.join(', ')}</b>`);
      if(d.water && d.water.alarmed && d.water.alarmed.length)
        log(`🔔 <b>alarm raised (auto off): ${d.water.alarmed.join(', ')}</b>`);
      if(d.tray && d.tray.alarmed && d.tray.alarmed.length)
        log(`🔔 tray alarm: ${d.tray.alarmed.join(', ')}`);
    }
    // read back the tray state the engine just wrote, to colour the 3D view
    const r2 = await fetch(`${API}/overview`);
    if(r2.ok){
      const d = await r2.json();
      let filling = 0;
      for(const h of d.houses) for(const s of h.sections){
        if(S[s.sectionId]) S[s.sectionId].status = (s.tray||{}).status;
        if((s.tray||{}).status === 'fill') filling++;
      }
      if(filling>0) log(`🧠 ML: ${filling} section(s) need tray water`);
    }
  }catch(e){ log('backend not reachable (start it on :8000)','err'); }
}

/* ══════════════ 3D SCENE ══════════════ */
const view=document.getElementById('view');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b1220);
const camera=new THREE.PerspectiveCamera(48,1,.1,300); camera.position.set(0,13,22);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); view.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.target.set(0,1.5,0);
const hemi=new THREE.HemisphereLight(0xdfeaff,0x2a3326,.55); scene.add(hemi);
const sunLight=new THREE.DirectionalLight(0xffffff,.7); scene.add(sunLight);
function rs(){const w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
addEventListener('resize',rs);
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c,transparent:true},o||{}));
function add(g,geo,m,x,y,z,rx,ry,rz){const o=new THREE.Mesh(geo,m);o.position.set(x||0,y||0,z||0);
  if(rx)o.rotation.x=rx;if(ry)o.rotation.y=ry;if(rz)o.rotation.z=rz;g.add(o);return o;}
function tag(g,t,x,y,z,sc,bg){
  const c=document.createElement('canvas'),fs=40,ct=c.getContext('2d');
  ct.font='bold '+fs+'px sans-serif';const w=ct.measureText(t).width;
  c.width=w+26;c.height=fs+18;const x2=c.getContext('2d');x2.font='bold '+fs+'px sans-serif';
  x2.fillStyle=bg||'rgba(15,23,42,.92)';x2.fillRect(0,0,c.width,c.height);
  x2.fillStyle='#fff';x2.textAlign='center';x2.textBaseline='middle';x2.fillText(t,c.width/2,c.height/2);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  const k=sc||.55; sp.scale.set(k*c.width/c.height,k,1); sp.position.set(x,y,z); g.add(sp); return sp;
}

// ground + shade house frame
add(scene,new THREE.PlaneGeometry(60,40),M(0x18251c),0,0,0,-Math.PI/2);
[-6,6].forEach(z=>{[-10,10].forEach(x=>add(scene,new THREE.CylinderGeometry(.09,.09,5,8),M(0x8a99a8),x,2.5,z));
  add(scene,new THREE.CylinderGeometry(.07,.07,20,8),M(0x8a99a8),0,5,z,0,0,Math.PI/2);});
[-10,10].forEach(x=>add(scene,new THREE.CylinderGeometry(.07,.07,12,8),M(0x8a99a8),x,5,0,Math.PI/2));
const net=add(scene,new THREE.PlaneGeometry(21,13),M(0x0a0f0a,{opacity:.32,side:THREE.DoubleSide}),0,5.3,0,-Math.PI/2);
// main water pipe
add(scene,new THREE.CylinderGeometry(.09,.09,20,8),M(0x38bdf8),0,4.2,-1.2,0,0,Math.PI/2);

const G={};
SECTIONS.forEach(sec=>{
  const g=new THREE.Group(); g.position.x=sec.x; scene.add(g); G[sec.id]=g;
  // bench + plants
  add(g,new THREE.BoxGeometry(3.6,.18,7),M(0x8a8f96),0,1.1,1);
  const pots=[];
  for(let z=-1.8;z<=3.8;z+=1.4) for(const px of [-1,1]){
    add(g,new THREE.CylinderGeometry(.2,.15,.4,8),M(0x8d5b3f),px,1.4,z);
    const lf=add(g,new THREE.SphereGeometry(.32,9,7),M(0x5f9e3a),px,1.75,z); lf.scale.y=.6; pots.push(lf);
    if(Math.random()<.4) add(g,new THREE.SphereGeometry(.11,7,6),M(0x9c4dcc),px+.15,2.15,z);
  }
  // humidity tray (under bench)
  add(g,new THREE.BoxGeometry(3.2,.06,2.4),M(0x64748b),0,.12,-1.6);
  [[-1.6,0],[1.6,0],[0,-1.2],[0,1.2]].forEach(p=>
    add(g,new THREE.BoxGeometry(p[0]?.06:3.2,.34,p[0]?2.4:.06),M(0x64748b),p[0],.29,-1.6+p[1]));
  const water=add(g,new THREE.BoxGeometry(3.05,.3,2.28),M(0x38bdf8,{opacity:.75}),0,.28,-1.6);
  // sensor device box
  add(g,new THREE.CylinderGeometry(.05,.05,3,7),M(0x8a99a8),1.9,1.5,-1.6);
  add(g,new THREE.BoxGeometry(.42,.55,.3),M(0xd7dde4),1.9,2.6,-1.6);
  const led=add(g,new THREE.SphereGeometry(.07,8,6),M(0x22c55e),1.9,2.95,-1.45);
  // drop pipe + nozzles
  add(g,new THREE.CylinderGeometry(.05,.05,1.6,7),M(0x38bdf8),0,3.5,-1.2);
  const noz=[];
  for(const z of [-.6,1,2.6]){ add(g,new THREE.CylinderGeometry(.06,.06,3.4,7),M(0x38bdf8),0,2.9,z,Math.PI/2);
    add(g,new THREE.ConeGeometry(.09,.2,8),M(0x0284c7),0,2.72,z,Math.PI); noz.push(new THREE.Vector3(sec.x,2.6,z)); }
  tag(g,sec.name,0,4.1,1,.62,'rgba(22,101,52,.95)');
  g.userData={water,led,noz,pots};
});

// droplet pool
const DR=[]; const dm=M(0x7dd3fc,{opacity:.9}); const fm=M(0xc084fc,{opacity:.9});
for(let i=0;i<420;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.05,5,4),dm);d.visible=false;scene.add(d);
  DR.push({m:d,v:new THREE.Vector3(),on:false});}
function drop(pos,fert){for(let i=0;i<DR.length;i++){const D=DR[i];if(!D.on){
  D.m.position.set(pos.x+(Math.random()-.5)*2.6,pos.y,pos.z+(Math.random()-.5)*.5);
  D.v.set((Math.random()-.5)*.6,-2.2,(Math.random()-.5)*.6);
  D.m.material=fert?fm:dm; D.on=true;D.m.visible=true;return;}}}

/* ══════════════ UI ══════════════ */
function renderCards(){
  const el=document.getElementById('cards'); let html='';
  for(const k in S){ const s=S[k];
    const cls = s.status==='fill'?'dry':s.status==='cooldown'?'cool':'ok';
    const col = s.rh<60?'#f59e0b':s.rh>80?'#38bdf8':'#22c55e';
    html+=`<div class="card ${cls}">
      <div class="nm">${s.name}
        <span class="tagx" style="background:${col}22;color:${col}">${s.status.toUpperCase()}</span></div>
      <div class="vals"><span>🌡 ${s.temp}°C</span><span style="color:${col}">💧 ${s.rh}%</span>
        <span>☀️ ${s.light}</span><span>VPD ${vpd(s.temp,s.rh)}</span></div>
      <div class="traybar"><div class="trayfill" style="width:${(s.tray/TRAY_MAX*100).toFixed(0)}%"></div></div>
      <div class="lbl">tray ${s.tray.toFixed(2)} / ${TRAY_MAX} cm ${s.pushOk===false?'· ⚠ push failed':''}</div>
    </div>`; }
  el.innerHTML=html;
}
document.getElementById('run').onclick=e=>{running=!running;
  e.target.textContent=running?'⏸ Pause':'▶ Run'; e.target.classList.toggle('on',running);};
document.getElementById('reset').onclick=()=>{day=1;lastPushAt=0;lastTrayCheckAt=0;lastPlanDay=0;
  simMin=nowMinutesOfDay(); simEpoch=Date.now();
  for(const k in S){S[k].tray=TRAY_MAX*0.6;S[k].waterBoost=0;S[k].spray=0;S[k].filling=0;}
  log('↺ trays and physics reset. The clock is real time and is never reset.');};

/* ══════════════ SIMULATION TICK ══════════════
   IMPORTANT: this runs on setInterval, NOT requestAnimationFrame.
   Browsers PAUSE requestAnimationFrame whenever the tab is hidden or the
   window is behind another one — which meant the simulator froze the moment
   you switched to look at the phone app. setInterval keeps running in the
   background (throttled to ~1 Hz), and because we integrate on real elapsed
   time the simulated clock stays correct either way. Rendering stays on rAF. */
let lastSim = performance.now();

function simTick(){
  const now = performance.now();
  // Chrome throttles background timers to ~1 Hz, and after ~5 minutes hidden to
  // ~1/minute. So the gap between ticks can be large — we must integrate the
  // WHOLE elapsed time, not a small capped slice, or the simulated clock silently
  // runs slow. Capped at 120 s so returning after hours does not jump wildly.
  const dtReal = Math.min(120, (now - lastSim) / 1000);
  lastSim = now;
  if (!running) return;

  // Real time: one real second is one second of simulated weather.
  let dtSim = dtReal / 60;                   // sim-minutes elapsed
  if (dtSim <= 0) return;

  // Physics is integrated in small chunks so a long catch-up step stays stable
  // (tray depletion and humidity are rate-based).
  let remaining = dtSim;
  while (remaining > 0){
    const step = Math.min(5, remaining);      // max 5 sim-minutes per chunk
    stepPhysics(step);
    remaining -= step;
  }

  // Taken from the clock, never accumulated: an integrated clock drifts, and a
  // drifting clock is what produced the 2027 timestamps.
  const prevMin = simMin;
  simMin   = nowMinutesOfDay();
  simEpoch = Date.now();
  if (simMin < prevMin){ day++; log(`🌅 <b>Day ${day} begins</b>`); }

  const nowReal = Date.now();
  if (nowReal - lastPushAt >= PUSH_EVERY_SEC * 1000){
    lastPushAt = nowReal; pushReadings(); pollCommands();
  }
  if (nowReal - lastTrayCheckAt >= 5 * 60 * 1000){
    lastTrayCheckAt = nowReal; autoML();
  }

  document.getElementById('time').textContent = fmt(simMin);
  document.getElementById('day').textContent  = 'Day ' + day;
}
setInterval(simTick, 200);

/* ══════════════ RENDER LOOP (visuals only) ══════════════ */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dtReal = Math.min(.05, (now - last) / 1000); last = now;

  // sun position + light
  const h=(simMin/60)%24, sunAng=Math.PI*(h-6)/12;
  const up=(h>=6&&h<=18)?Math.max(0,Math.sin(sunAng)):0;
  sunLight.position.set(Math.cos(sunAng)*20,3+up*22,8); sunLight.intensity=.15+up*.75;
  hemi.intensity=.18+up*.5; scene.background.setHSL(.6,.45,.04+up*.10);

  // per-section visuals
  for(const k in S){ const s=S[k], g=G[k], u=g.userData;
    const lvl=s.tray/TRAY_MAX;
    u.water.scale.y=Math.max(.02,lvl); u.water.position.y=.13+.15*lvl;
    u.water.material.opacity=s.tray>0.03?.75:0;
    u.led.material.color.setHex(s.filling>0?0x38bdf8:s.spray>0?0x22c55e:s.status==='fill'?0xf59e0b:0x22c55e);
    if(s.spray>0)  for(let i=0;i<3;i++) drop(u.noz[Math.floor(Math.random()*u.noz.length)], s.fert>0);
    if(s.filling>0) for(let i=0;i<2;i++) drop(new THREE.Vector3(s.x,2.2,-1.6), false);
    const dry=s.rh<55; u.pots.forEach(p=>p.material.color.setHex(dry?0x7f9e4a:0x5f9e3a));
  }
  for(let i=0;i<DR.length;i++){const D=DR[i];if(!D.on)continue;
    D.v.y-=9*dtReal; D.m.position.addScaledVector(D.v,dtReal);
    if(D.m.position.y<0.4){D.on=false;D.m.visible=false;}}

  controls.update(); renderer.render(scene,camera);
}
rs(); renderCards(); setInterval(renderCards,600);
refreshRealSections(); setInterval(refreshRealSections, 30000);
log('Simulator ready. Data goes to the <b>real Firebase</b> — the app sees it as live sensors.');
log('Keeps running in the background, so you can switch to the phone app.');
log('<b>Real time</b>: readings carry the wall clock, and any section with a real node linked is skipped.');
requestAnimationFrame(loop);
</script>
