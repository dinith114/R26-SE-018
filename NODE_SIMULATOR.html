<!doctype html>
<meta charset="utf-8">
<title>Orchid node bench</title>
<!--
  A bench of virtual ESP32 nodes.

  WHAT THIS IS
  ------------
  Twenty sensor boards cost about LKR 47,000 and take a week to build. This page
  stands in for them: each virtual node speaks the SAME Firebase protocol as
  firmware validation-1.9, on the same paths, with the same payload keys. The
  mobile app has no way to tell one of these from a board on the bench, and that
  is the entire point - a simulator the app knows about tests the simulator, not
  the app.

  It runs on the laptop, in a browser. It is not part of the app and must never
  become part of it.

  WHAT IT COPIES, LINE FOR LINE
  -----------------------------
    announce      PATCH /devices/{MAC}.json     {mac,ip,rssi,fw,ssid,lastSeen}
    assignment    GET   /devices/{MAC}.json     reads assignedTo, readIntervalMs
    reading       PUT   /farm/houses/{h}/sections/{s}/latest.json
                  POST  /farm/history/{h}/{s}.json
    section cmd   GET   /farm/houses/{h}/sections/{s}/command.json
                  PUT   .../commandAck.json
    master queue  GET   /farm/masters/{MAC}/queue.json
                  PUT   /farm/masters/{MAC}/running.json    before the valve opens
                  GET   /farm/masters/{MAC}/stop.json       while it pours
                  PUT   /farm/masters/{MAC}/acks/{id}.json  then DELETE the entry

  The running/stop pair is new in validation-1.9 and is what makes a countdown
  and a Stop button possible for a routed pour. Before it, the controller said
  nothing between accepting a command and finishing it, so the app had no start
  time to count down from and Stop was answered "unsupported".

  PATCH, never PUT, on the device record. A PUT wipes `assignedTo`, which the
  APP owns; the firmware comments on this and so does this file, because it is
  the one mistake here that silently unpairs every node in the house.

  THE GUARD
  ---------
  Nothing is written to a house whose meta lacks `simulated: true`. Invented
  readings in a measured archive cannot be separated afterwards, and H1 is a
  real house with real plants. The Claim button marks a house simulated, and it
  refuses H1 outright.

  THE ENGINE PASS IS FARM-WIDE
  ----------------------------
  run-now is not scoped to a section. It evaluates EVERY house, so a button
  aimed at a simulated one can open a valve in a real one - and the pretend
  clock makes that likelier, not less, because it can land on a minute the real
  house is due. Every scenario button therefore checks the non-simulated houses
  first and refuses if any of them would act. See realRisk().

  FORCING A CONDITION
  -------------------
  A node can be pushed to a dry or a hot state so the farm has to react. That is
  the only way to rehearse the Auto-OFF alarm path on demand: the tray decision
  is made from the CURRENT reading, so a section that is comfortable will never
  raise one no matter how long you wait. Forcing only changes what the node
  reports - every decision downstream is the real one.

  ONE WRITER PER SECTION
  ----------------------
  Do not run this at the same time as backend/scripts/sim_farm.py against the
  same house, and do not leave two tabs of it open. Two writers on one section
  interleave readings from two different clocks, and the result looks like a
  hardware fault rather than an operator error. The older FARM_SIMULATOR.html
  in this folder ran a fast-forward clock and once stamped 2027 dates onto the
  live farm; this page uses real wall-clock time only, and never writes ahead
  of now.
-->

<script>
'use strict';

/* The database the real boards write to. Already public: it is compiled into
   firmware/sensor_node_validate/sensor_node_validate.ino line 311, which is in
   this same public repository. Putting it here exposes nothing new. */
const FB = 'https://orchid-smart-care-default-rtdb.firebaseio.com';

const FW = 'validation-2.0';   // must match the firmware, or the backend's
                               // legacy-window logic treats these differently

/* ══════════════════════════════════════ Tenant ═════════════════════════════
   Every farm path now hangs off a tenant, matching the firmware's
   `FARM = FB_HOST + "/tenants/" TENANT_ID "/farm"`. There is no compile-time
   constant here - the operator types it into the header field - so it is read
   fresh from the DOM on every call rather than cached, and NEVER defaulted.
   /devices/{MAC} is untouched: that registry is global on purpose. */
function tenantId() {
  const el = $('tenant');
  return el ? el.value.trim() : '';
}
function farmPath(suffix) {
  return '/tenants/' + tenantId() + '/farm' + suffix;
}

/* ══════════════════════════════════════ Firebase REST ═════════════════════ */

async function fb(method, path, body) {
  // No tenant, no farm request - READS included. An empty tenantId() makes
  // farmPath() produce '/tenants//farm/...', which this refuses rather than
  // letting it reach Firebase. Same rule the backend enforces, same reason: a
  // silent fallback to the old shared '/farm/...' tree is the bug this bench
  // exists to catch, so there is no fallback, only a refusal.
  //
  // Refusing GETs matters as much as refusing writes. Allowed through, a read
  // with no tenant just comes back empty, and the operator sees an empty house
  // list with nothing saying why - which reads as "the farm is gone", not as
  // "you have not told me whose farm".
  if (path.indexOf('/tenants//farm') === 0) {
    log('t-err', 'no tenant set - refusing to ' + method + ' ' + path
        + '. Type the tenant id in the header first.');
    return null;
  }
  const opt = { method: method };
  if (body !== undefined) {
    opt.headers = { 'Content-Type': 'application/json' };
    opt.body = JSON.stringify(body);
  }
  try {
    const r = await fetch(FB + path, opt);
    if (!r.ok) { log('t-err', method + ' ' + path + ' -> ' + r.status); return null; }
    const txt = await r.text();
    return (txt === 'null' || txt === '') ? null : JSON.parse(txt);
  } catch (e) {
    log('t-err', method + ' ' + path + ' -> ' + e.message);
    return null;
  }
}
const fbGet    = function (p)    { return fb('GET', p); };
const fbPut    = function (p, d) { return fb('PUT', p, d); };
const fbPatch  = function (p, d) { return fb('PATCH', p, d); };
const fbPost   = function (p, d) { return fb('POST', p, d); };
const fbDelete = function (p)    { return fb('DELETE', p); };

/* Firebase push ids, the real algorithm. Generating our own keys lets a whole
   backfill go up as ONE patch per section instead of 432 POSTs, and these sort
   chronologically exactly as server-generated ones do, so any reader that
   trusts key order still gets the right answer. */
const PUSH_CHARS = '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
let lastPushMs = 0;
const lastRand = [];
function pushId(ms) {
  let now = (ms === undefined) ? Date.now() : ms;
  const dup = (now === lastPushMs);
  lastPushMs = now;
  const tc = new Array(8);
  for (let i = 7; i >= 0; i--) { tc[i] = PUSH_CHARS.charAt(now % 64); now = Math.floor(now / 64); }
  let id = tc.join('');
  if (!dup) { for (let i = 0; i < 12; i++) lastRand[i] = Math.floor(Math.random() * 64); }
  else { let i = 11; for (; i >= 0 && lastRand[i] === 63; i--) lastRand[i] = 0; lastRand[i]++; }
  for (let i = 0; i < 12; i++) id += PUSH_CHARS.charAt(lastRand[i]);
  return id;
}

/* ══════════════════════════════════════ Randomness ════════════════════════ */

function crc32(str) {
  let c, crc = 0xFFFFFFFF;
  for (let i = 0; i < str.length; i++) {
    c = (crc ^ str.charCodeAt(i)) & 0xFF;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rnd, mu, sd) {
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
/* Beta(2,5) exactly, via order statistics: for integer a,b the a-th smallest of
   a+b-1 uniforms IS Beta(a,b). Cheaper and more obviously correct than a gamma
   ratio, and it matches random.betavariate(2,5) in sim_farm.py. */
function beta25(rnd) {
  const u = [];
  for (let i = 0; i < 6; i++) u.push(rnd());
  u.sort(function (p, q) { return p - q; });
  return u[1];
}

/* ══════════════════════════════════════ The field ═════════════════════════ */
/*
   Ported from backend/scripts/sim_farm.py. Same structure, same constants, same
   reasoning - read that file for why each term exists; the comments there are
   the argument and are not repeated here.

   ONE DELIBERATE DIFFERENCE. sim_farm seeded the building from
   abs(hash(house_id)), and Python randomises string hashing per process, so it
   drew a DIFFERENT building on every run - measured 56931, 872 and 32728 for
   'H5' on three consecutive runs - while its comment promised the opposite.
   Both files now use crc32, so a house keeps its posts and thin netting in the
   same places for good. The two layouts are not identical to each other, since
   the PRNGs differ, but each is stable and drawn from the same distribution.
*/
const N_ANOMALIES = 6, ANOMALY_RADIUS_M = 2.2, ANOMALY_STRENGTH_C = 0.8;
const MAX_LAG_HOURS = 0.75;
const DRAFT_COOLING_C = 1.2, DRAFT_REACH_M = 3.5;
const SENSOR_NOISE_C = 0.5;                 // DHT22 datasheet, not a guess
const CLOUD_BAND_M = 9.0, CLOUD_DRIFT_MS = 4.0;

function makeField(houseId, width, length) {
  const w = Math.max(Number(width) || 10, 1), l = Math.max(Number(length) || 14, 1);
  const rnd = mulberry32(crc32(houseId) & 0xFFFF);
  const anoms = [];
  for (let i = 0; i < N_ANOMALIES; i++)
    anoms.push([rnd() * w, rnd() * l, (rnd() * 2 - 1) * ANOMALY_STRENGTH_C]);
  const doorX = rnd() * w, doorY = (rnd() < 0.5) ? 0 : l;

  function structural(x, y, elev, sunDir) {
    const len = Math.min(6.0, 1.2 / Math.max(0.2, elev));
    const shift = len * sunDir;
    let t = 0;
    for (let i = 0; i < anoms.length; i++) {
      const ax = anoms[i][0], ay = anoms[i][1], amp = anoms[i][2];
      const d2 = Math.pow(x - (ax + shift), 2) + Math.pow(y - ay, 2);
      t += amp * Math.exp(-d2 / (2 * ANOMALY_RADIUS_M * ANOMALY_RADIUS_M));
    }
    return t;
  }

  return {
    w: w, l: l,
    at: function (x, y, hour, cloud, ambient, wind, noise, tMin) {
      const depth = y / l;
      const shade = Math.exp(-2.2 * depth);
      const edge = 1.0 - 0.35 * Math.abs((x / w) - 0.5) * 2.0;

      const h = hour - MAX_LAG_HOURS * depth;
      const elev = (h >= 6 && h <= 18)
        ? Math.max(0, Math.sin(Math.PI * (h - 6.0) / 12.0)) : 0;
      const sun = elev * (1 - cloud);
      const sunDir = (hour < 12) ? -1 : 1;

      const span = l + 2 * CLOUD_BAND_M;
      const bandPos = ((((tMin * 60 * CLOUD_DRIFT_MS) % span) + span) % span) - CLOUD_BAND_M;
      const shadow = Math.exp(-Math.pow(y - bandPos, 2) / (2 * Math.pow(CLOUD_BAND_M / 2.5, 2)));
      const localSun = sun * (1 - 0.55 * shadow * cloud);

      let temp = 24.0 + ambient + 9.0 * shade * edge * localSun;
      temp += structural(x, y, elev, sunDir) * (0.3 + 0.7 * localSun);

      const dd = Math.hypot(x - doorX, y - doorY);
      if (dd < DRAFT_REACH_M) temp -= DRAFT_COOLING_C * wind * (1 - dd / DRAFT_REACH_M);
      temp += gauss(noise, 0, SENSOR_NOISE_C);

      let humid = 92.0 - 2.6 * (temp - 24.0) + gauss(noise, 0, 1.0);
      humid = Math.min(99, Math.max(30, humid));
      const light = 32000 * shade * edge * localSun + gauss(noise, 0, 300);

      temp = Math.round(temp * 10) / 10;
      humid = Math.round(humid * 10) / 10;
      const svp = 0.6108 * Math.exp(17.27 * temp / (temp + 237.3));
      return {
        temperature: temp,
        humidity: humid,
        light: Math.round(Math.max(0, light) * 10) / 10,
        vpd: Math.round(svp * (1 - humid / 100) * 1000) / 1000
      };
    }
  };
}
function weatherAt(rnd) {
  return { cloud: beta25(rnd), ambient: gauss(rnd, 0, 1.4),
           wind: Math.max(0, gauss(rnd, 0.35, 0.3)) };
}

/* ══════════════════════════════════════ State ═════════════════════════════ */

const RELAY_MAX_SEC = 120;          // firmware ceiling, honoured here too
const CAL_DAYS = 3, CAL_MIN_READINGS = 400;
const BACKFILL_STEP_MS = 10 * 60 * 1000;   // 10 min, matching the placement bucket
const BACKFILL_DAYS = 3.05;                // 439 readings - clears 400 with room

let nodes = [];                     // the bench
let houseId = null, houseMeta = null, sections = {}, field = null;
let selected = null;                // mac awaiting a section tap
let ticking = false;
const fieldCache = {};              // houseId -> {meta, sections, field}

const $ = function (id) { return document.getElementById(id); };

function log(cls, msg) {
  const el = $('log');
  if (!el) return;
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = new Date().toLocaleTimeString('en-GB') + '  ' + msg;
  el.insertBefore(d, el.firstChild);
  while (el.childNodes.length > 400) el.removeChild(el.lastChild);
}

function save() {
  try {
    localStorage.setItem('orchidBench', JSON.stringify({
      nodes: nodes.map(function (n) {
        return { mac: n.mac, on: n.on, ip: n.ip, ssid: n.ssid, rssi: n.rssi };
      }),
      houseId: houseId
    }));
  } catch (e) { /* private window; the bench still works, it just forgets */ }
}
function restore() {
  try {
    const raw = localStorage.getItem('orchidBench');
    if (!raw) return;
    const d = JSON.parse(raw);
    nodes = (d.nodes || []).map(function (n) {
      return { mac: n.mac, on: !!n.on, ip: n.ip, ssid: n.ssid, rssi: n.rssi,
               assignedTo: null, busy: false, last: null, lastCmdId: null };
    });
    houseId = d.houseId || null;
  } catch (e) { /* ignore a corrupt entry rather than dying on load */ }
}

/* MACs in Espressif's range, so they look like what they are pretending to be.
   The real node on the bench is 1CC3ABC321A0. */
function newMac() {
  let m;
  do {
    m = '1CC3AB';
    for (let i = 0; i < 6; i++) m += '0123456789ABCDEF'[Math.floor(Math.random() * 16)];
  } while (nodes.some(function (n) { return n.mac === m; }));
  return m;
}

/* ══════════════════════════════════════ One node cycle ════════════════════ */
/*
   The order is the firmware's order and the order matters: announce, then read
   the assignment, THEN post - so a reading always lands in whatever section the
   board currently belongs to, never in the one it belonged to a moment ago.
*/

async function announce(n) {
  // PATCH. A PUT here would wipe assignedTo, which the app owns, and silently
  // unpair every node in the house.
  await fbPatch('/devices/' + n.mac + '.json', {
    mac: n.mac, ip: n.ip, rssi: n.rssi, fw: FW, ssid: n.ssid,
    tenantId: tenantId(),
    lastSeen: Math.floor(Date.now() / 1000)
  });
}

async function fetchAssignment(n) {
  const rec = await fbGet('/devices/' + n.mac + '.json');
  if (!rec) return;
  const was = n.assignedTo;
  const v = rec.assignedTo;
  n.assignedTo = (v && String(v).indexOf('/') > 0) ? String(v) : null;
  if (was !== n.assignedTo) {
    log('t-sys', n.mac.slice(-4) + ' assignment ' + (n.assignedTo || 'cleared'));
    renderPool(); renderMap();
  }
}

/* The house a node is assigned to is not necessarily the one on screen, so the
   geometry is fetched per house and cached. A real board has no idea where it
   is; it reports to the section the app named, and the field is sampled at that
   section's stored coordinates. */
async function geomFor(hid) {
  if (fieldCache[hid]) return fieldCache[hid];
  const meta = await fbGet(farmPath('/houses/' + hid + '/meta.json'));
  if (!meta) return null;
  if (!meta.simulated) {
    log('t-err', 'REFUSED: ' + hid + ' is not marked simulated. Nothing written.');
    fieldCache[hid] = null;
    return null;
  }
  const secs = await fbGet(farmPath('/houses/' + hid + '/sections.json')) || {};
  const pos = {};

  /* A SECTION WITH NO COORDINATES USED TO BE DROPPED SILENTLY, and that is the
     whole bug behind "the node is connected but there are no readings".
     `postReading` looked the section up in this map, found nothing, and
     returned - no reading, no log, no error. The board announced itself
     perfectly, showed as online in the app, and wrote nothing, for hours.
     Silence was the failure.
     Only a house built by the PLANNER has x/y on its sections; one created by
     hand in Add Section has none, which is most houses a farmer makes. */
  const W = Math.max(Number(meta.width) || 10, 1);
  const L = Math.max(Number(meta.length) || 14, 1);
  const ids = Object.keys(secs).sort(function (a, b) {
    const na = parseInt(String(a).replace(/\D/g, ''), 10) || 0;
    const nb = parseInt(String(b).replace(/\D/g, ''), 10) || 0;
    return na - nb;
  });
  const cols = Math.max(1, Math.ceil(Math.sqrt(ids.length)));
  const rows = Math.max(1, Math.ceil(ids.length / cols));
  let placed = 0;

  ids.forEach(function (sid, i) {
    const m = (secs[sid] || {}).meta || {};
    if (m.x !== undefined && m.y !== undefined && m.x !== null && m.y !== null) {
      pos[sid] = { x: Number(m.x), y: Number(m.y), name: m.name || sid, real: true };
      return;
    }
    // Spread the rest evenly, so each one still sits somewhere different in the
    // field and the readings differ between zones the way they would in a real
    // house. Used for the SIMULATION only - nothing is written back to the
    // section, because a made-up position is not a survey and the placement
    // analysis must never see one.
    const c = i % cols, r = Math.floor(i / cols);
    pos[sid] = { x: W * (c + 0.5) / cols, y: L * (r + 0.5) / rows,
                 name: m.name || sid, real: false };
    placed++;
  });
  if (placed) {
    log('t-sys', hid + ': ' + placed + ' section(s) have no position, so the bench '
        + 'spread them on an even grid to sample the field. Nothing is written back '
        + '- only a planned house gets real coordinates.');
  }
  const g = { meta: meta, pos: pos,
              field: makeField(hid, meta.width, meta.length) };
  fieldCache[hid] = g;
  return g;
}

/* One reading, at one place, at one moment. Weather is drawn from the MOMENT so
   every section in the house sees the same sky - that shared term is what makes
   the field spatially coherent instead of eight independent noise generators. */
function readingAt(g, sid, tMs) {
  const p = g.pos[sid];
  if (!p) return null;
  const wr = mulberry32(crc32(String(tMs)) & 0xFFFFFFF);
  const w = weatherAt(wr);
  const nr = mulberry32(crc32(sid + ':' + tMs) & 0xFFFFFFF);
  const d = new Date(tMs);
  const hour = d.getHours() + d.getMinutes() / 60;
  const r = g.field.at(p.x, p.y, hour, w.cloud, w.ambient, w.wind, nr, tMs / 60000);

  // The probe. Raw counts drift slowly with the tray; the percentage is the
  // firmware's mapping of that raw value, not an independent number.
  const raw = Math.round(1750 + 260 * Math.sin(tMs / 36e5) + gauss(nr, 0, 40));
  return {
    temperature: r.temperature,
    humidity: r.humidity,
    light: r.light,
    vpd: r.vpd,
    timestamp: tMs,
    sampleMoisture: Math.round(Math.max(0, Math.min(100, (2600 - raw) / 12)) * 10) / 10,
    soilRaw: raw,
    sensorFault: false,
    node: 'validation'
  };
}

/* Force a node to report a condition the farm has to answer.
 *
 * WHY THIS EXISTS. The Auto-OFF alarm is raised from the CURRENT reading: the
 * tray decision looks at humidity, temperature, light and hour together and a
 * comfortable section never asks for anything. So there is no way to rehearse
 * the alarm - or the push, or the lock-screen wake - by waiting. The condition
 * has to be made to happen.
 *
 * Only the READING is forced. The tray model still decides, the engine still
 * decides whether to act or to alarm, and the push still goes through FCM. What
 * is simulated is the weather, which is exactly the part a bench should
 * simulate and no more.
 */
const FORCE = {
  dry: { humidity: 38, temperature: 33, light: 26000,
         why: 'well below the 60% band on a hot bright day - the tray model '
            + 'should ask for a fill' },
  hot: { humidity: 46, temperature: 37, light: 31000,
         why: 'extreme heat and dry air - tray fill, and a second watering '
            + 'becomes possible in the afternoon window' },
};

function applyForce(n, rd) {
  const f = FORCE[n.force];
  if (!f) return rd;
  const t = f.temperature, rh = f.humidity;
  const svp = 0.6108 * Math.exp(17.27 * t / (t + 237.3));
  return { ...rd, temperature: t, humidity: rh, light: f.light,
           vpd: Math.round(svp * (1 - rh / 100) * 1000) / 1000 };
}

async function postReading(n) {
  const parts = n.assignedTo.split('/');
  const hid = parts[0], sid = parts[1];
  const g = await geomFor(hid);
  if (!g) {
    // geomFor already logged why (not simulated, or the house is gone).
    return;
  }
  if (!g.pos[sid]) {
    log('t-err', n.mac.slice(-4) + ' is assigned to ' + n.assignedTo
        + ' but that section does not exist in the house. Re-link it.');
    return;
  }

  const now = Date.now();                 // real wall clock, never ahead of it
  let rd = readingAt(g, sid, now);
  if (!rd) return;
  rd = applyForce(n, rd);
  n.last = rd;
  await fbPut(farmPath('/houses/' + hid + '/sections/' + sid + '/latest.json'), rd);
  await fbPost(farmPath('/history/' + hid + '/' + sid + '.json'), rd);
  log('t-dim', n.mac.slice(-4) + ' ' + sid + '  ' + rd.temperature + 'C  '
      + rd.humidity + '%  ' + Math.round(rd.light) + ' lx');
}

/* ── commands ───────────────────────────────────────────────────────────── */
/*
   Two contracts, both real, both polled - exactly as the firmware does.

   A section command at .../command is what an unrouted action uses; the master
   queue at /farm/masters/{MAC}/queue is what every pour goes through now. A
   simulator that only implemented one of them would pass tests the hardware
   fails.
*/

function pourSeconds(secs) {
  const s = Math.max(0, Math.min(RELAY_MAX_SEC, Number(secs) || 0));
  return new Promise(function (res) { setTimeout(res, s * 1000); });
}

async function pollSectionCommand(n) {
  if (!n.assignedTo || n.busy) return;
  const parts = n.assignedTo.split('/');
  const base = farmPath('/houses/' + parts[0] + '/sections/' + parts[1]);
  const c = await fbGet(base + '/command.json');
  if (!c || !c.id || c.id === n.lastCmdId) return;

  n.lastCmdId = c.id;
  const secs = Math.max(0, Math.min(RELAY_MAX_SEC, Number(c.durationSec) || 0));
  n.busy = true; renderPool();
  log('t-cmd', n.mac.slice(-4) + ' section cmd ' + c.action + ' ' + secs + 's');
  await pourSeconds(secs);
  n.busy = false; renderPool();

  await fbPut(base + '/commandAck.json', {
    id: c.id, action: c.action, durationSec: secs,
    started: true, stopped: false, done: true,
    at: Math.floor(Date.now() / 1000)
  });
  log('t-ok', n.mac.slice(-4) + ' acked ' + c.id);
}

async function pollMasterQueue(n) {
  if (n.busy) return;
  const q = await fbGet(farmPath('/masters/' + n.mac + '/queue.json'));
  if (!q) return;
  const ids = Object.keys(q);
  if (!ids.length) return;

  // ONE at a time. Eight channels, one pump: two valves open together halves
  // the pressure at both and under-waters two sections instead of watering one.
  const id = ids.sort()[0];
  const c = q[id] || {};
  const ch = Number(c.channel) || 0;
  const target = c.targetSection || '?';

  if (ch < 1 || ch > 8) {
    await ackMaster(n, id, target, ch, 0, 'invalid');
    log('t-err', n.mac.slice(-4) + ' bad channel ' + ch + ' -> invalid');
    return;
  }
  if (c.action !== 'water' && c.action !== 'tray') {
    await ackMaster(n, id, target, ch, 0, 'unsupported');
    return;
  }

  const secs = Math.max(0, Math.min(RELAY_MAX_SEC, Number(c.durationSec) || 0));
  n.busy = true; renderPool();
  log('t-cmd', n.mac.slice(-4) + ' MASTER ' + c.action + ' ' + target
      + ' ch' + ch + ' ' + secs + 's');

  /* Say the pour has STARTED, before it starts. validation-1.9 publishes this
     the moment before the valve opens and deletes it when the valve shuts, so
     the app can count down against the node's clock instead of guessing. A
     simulator that skipped it would let the app look correct here and fail
     against the real board, which is the one thing this bench must never do. */
  const startedAt = Math.floor(Date.now() / 1000);
  await fbPut(farmPath('/masters/' + n.mac + '/running.json'), {
    id: id, targetSection: target, channel: ch,
    durationSec: secs, startedAt: startedAt
  });

  /* Cooperative, like the firmware: a Stop naming this run cuts it short. The
     real board can only check every STOP_POLL_MS because a TLS handshake costs
     it seconds; here a check is free, so it polls faster - the OUTCOME is
     identical, and pretending to be slow would only make the bench worse at
     finding bugs. */
  const stopped = await pourWatchingForStop(n, id, secs);

  await fbDelete(farmPath('/masters/' + n.mac + '/running.json'));
  const ran = Math.min(secs, Math.floor(Date.now() / 1000) - startedAt);
  n.busy = false; renderPool();

  await ackMaster(n, id, target, ch, stopped ? ran : secs,
                  stopped ? 'stopped' : 'done');
  log(stopped ? 't-sys' : 't-ok',
      n.mac.slice(-4) + ' ' + target + (stopped ? ' STOPPED after ' + ran
                                                : ' poured ' + secs) + 's');
}

/* Wait out the pour, watching for a stop aimed at THIS run. Returns true if it
   was cut short. Matched by id for the same reason the firmware matches by id:
   a stop pressed a second too late must not kill the next pour. */
async function pourWatchingForStop(n, id, secs) {
  const until = Date.now() + secs * 1000;
  while (Date.now() < until) {
    await new Promise(function (r) { setTimeout(r, 300); });
    const want = await fbGet(farmPath('/masters/' + n.mac + '/stop.json'));
    if (want && String(want).indexOf(id) >= 0) {
      await fbDelete(farmPath('/masters/' + n.mac + '/stop.json'));
      return true;
    }
  }
  return false;
}

async function ackMaster(n, id, section, channel, ranSec, outcome) {
  // Ack FIRST, then delete: a crash between the two leaves evidence the pour
  // happened rather than a silently empty queue.
  await fbPut(farmPath('/masters/' + n.mac + '/acks/' + id + '.json'), {
    id: id, targetSection: section, channel: channel, ranSec: ranSec,
    outcome: outcome, by: n.mac, at: Math.floor(Date.now() / 1000)
  });
  await fbDelete(farmPath('/masters/' + n.mac + '/queue/' + id + '.json'));
}

async function cycleOne(n) {
  if (!n.on) return;
  await announce(n);
  await fetchAssignment(n);
  if (n.assignedTo) await postReading(n);
  await pollSectionCommand(n);
  await pollMasterQueue(n);
}

/* Commands are polled far more often than readings are posted, because that is
   what the firmware does: a pour has to start within seconds of the button, but
   a reading every ten seconds would be a different sensor. */
async function tick() {
  if (ticking) return;
  ticking = true;
  try {
    for (const n of nodes) {
      if (!n.on) continue;
      await pollSectionCommand(n);
      await pollMasterQueue(n);
    }
  } finally { ticking = false; }
}

let lastFull = 0;
async function fullCycle() {
  const every = Math.max(5, Number($('cycle').value) || 30) * 1000;
  if (Date.now() - lastFull < every) return;
  lastFull = Date.now();
  for (const n of nodes) await cycleOne(n);
  refreshCal();
}

/* ══════════════════════════════════════ Skip to ready ═════════════════════ */
/*
   Writes the calibration window that three real days would have produced, and
   moves startedAt back to match. Both halves are needed: the backend's
   readiness check requires the elapsed days AND every section above
   minReadings, deliberately, so that a progress bar cannot advance while a node
   is unplugged.

   The readings are real field samples at real past timestamps, ten minutes
   apart and ALIGNED ACROSS SECTIONS - which is what the placement analysis
   needs, since it only uses moments every section contributed to.
*/
async function skipToReady() {
  if (!houseId || !houseMeta) return;
  if (!houseMeta.simulated) { alert('Mark the house simulated first.'); return; }

  const placed = nodes.filter(function (n) {
    return n.assignedTo && n.assignedTo.split('/')[0] === houseId;
  });
  const sids = Object.keys(sections).sort();
  const covered = {};
  placed.forEach(function (n) { covered[n.assignedTo.split('/')[1]] = true; });
  const missing = sids.filter(function (s) { return !covered[s]; });

  if (missing.length) {
    if (!confirm('These sections have no node and will get no data:\n  '
        + missing.join(', ')
        + '\n\nThe house will NOT reach ready until they do. Continue anyway?')) return;
  }
  const n = Math.ceil(BACKFILL_DAYS * 86400000 / BACKFILL_STEP_MS);
  if (!confirm('Write ' + n + ' readings to each of ' + (sids.length - missing.length)
      + ' section(s), covering the last ' + BACKFILL_DAYS + ' days, and move the '
      + 'calibration start back to match?')) return;

  const g = await geomFor(houseId);
  if (!g) return;

  $('skip').disabled = true;
  const t0 = Date.now();
  // Align every section to the same grid of instants, ending now.
  const stamps = [];
  for (let k = n - 1; k >= 0; k--) stamps.push(t0 - k * BACKFILL_STEP_MS);

  let written = 0;
  for (const sid of sids) {
    if (!covered[sid]) continue;
    const batch = {};
    let last = null;
    for (const t of stamps) {
      const rd = readingAt(g, sid, t);
      if (!rd) continue;
      batch[pushId(t)] = rd;
      last = rd;
    }
    // A successful PATCH echoes the object back; fb() returns null on failure.
    const echo = await fbPatch(farmPath('/history/' + houseId + '/' + sid + '.json'), batch);
    if (echo === null) { log('t-err', sid + ' backfill FAILED - not counted'); continue; }
    written += Object.keys(batch).length;
    if (last) await fbPut(farmPath('/houses/' + houseId + '/sections/' + sid + '/latest.json'), last);
    log('t-ok', 'backfilled ' + sid + ': ' + Object.keys(batch).length + ' readings');
  }

  await fbPatch(farmPath('/houses/' + houseId + '/meta/calibration.json'), {
    startedAt: t0 - BACKFILL_DAYS * 86400000,
    targetDays: CAL_DAYS,
    minReadings: CAL_MIN_READINGS
  });
  log('t-sys', 'calibration start moved back ' + BACKFILL_DAYS + ' days; '
      + written + ' readings written');
  $('skip').disabled = false;
  await loadHouse(houseId);
  refreshCal();
}

/* Counted the way the backend counts it - from stored readings, shallow so the
   whole archive is not downloaded to find its length. */
async function refreshCal() {
  if (!houseId) { $('cal').textContent = '—'; return; }
  const sids = Object.keys(sections).sort();
  if (!sids.length) { $('cal').textContent = 'no sections'; return; }
  let ready = 0;
  for (const sid of sids) {
    const keys = await fbGet(farmPath('/history/' + houseId + '/' + sid + '.json?shallow=true'));
    const c = keys ? Object.keys(keys).length : 0;
    sections[sid].readings = c;
    if (c >= CAL_MIN_READINGS) ready++;
  }
  const cal = (houseMeta && houseMeta.calibration) || {};
  const days = cal.startedAt ? (Date.now() - cal.startedAt) / 86400000 : 0;
  $('cal').innerHTML = '<b>' + ready + '/' + sids.length + '</b> sections have data &middot; <b>'
    + days.toFixed(2) + '</b> of ' + CAL_DAYS + ' days';
  renderMap();
}

/* ══════════════════════════════════════ Assignment ════════════════════════ */
/*
   The same two writes the app's own assign endpoint makes (devices.py), in the
   same order, including displacing whoever held the section first - so there is
   never a moment where two boards both believe they own it.

   Doing it here is a shortcut for the tapping, not a second source of truth:
   every node re-reads assignedTo from /devices each cycle, so a link made in
   the APP is picked up exactly the same way. Both routes work; neither wins.
*/
async function assign(mac, sid) {
  const target = houseId + '/' + sid;

  const holder = nodes.find(function (n) { return n.assignedTo === target && n.mac !== mac; });
  if (holder) {
    await fbDelete('/devices/' + holder.mac + '/assignedTo.json');
    holder.assignedTo = null;
    log('t-sys', holder.mac.slice(-4) + ' displaced from ' + sid);
  }
  await fbPut('/devices/' + mac + '/assignedTo.json', target);
  await fbPut(farmPath('/houses/' + houseId + '/sections/' + sid + '/deviceMac.json'), mac);

  const n = nodes.find(function (x) { return x.mac === mac; });
  if (n) { n.assignedTo = target; n.on = true; }
  log('t-ok', mac.slice(-4) + ' installed in ' + sid);
  selected = null;
  renderPool(); renderMap();
  if (n) cycleOne(n);
}

async function unassign(mac) {
  const n = nodes.find(function (x) { return x.mac === mac; });
  if (!n || !n.assignedTo) return;
  const parts = n.assignedTo.split('/');
  await fbDelete('/devices/' + mac + '/assignedTo.json');
  await fbDelete(farmPath('/houses/' + parts[0] + '/sections/' + parts[1] + '/deviceMac.json'));
  log('t-sys', mac.slice(-4) + ' taken out of ' + parts[1]);
  n.assignedTo = null;
  renderPool(); renderMap();
}

/* Taking a board out of the house for good - what the placement result tells
   the farmer to do with the sensors it found redundant. The device record goes
   too, otherwise the app keeps offering a node that is sitting in a drawer. */
async function removeNode(mac) {
  const n = nodes.find(function (x) { return x.mac === mac; });
  if (!n) return;
  if (!confirm('Remove board ' + mac.slice(-4) + ' from the farm?\n'
      + 'It is unlinked from its section and deleted from /devices.')) return;
  await unassign(mac);
  await fbDelete('/devices/' + mac + '.json');
  nodes = nodes.filter(function (x) { return x.mac !== mac; });
  if (selected === mac) selected = null;
  save(); renderPool(); renderMap();
  log('t-sys', mac.slice(-4) + ' removed');
}

/* ══════════════════════════════════════ Rendering ═════════════════════════ */

function renderPool() {
  const el = $('pool');
  el.innerHTML = '';
  $('nodeCount').textContent = nodes.length
    ? nodes.filter(function (n) { return n.on; }).length + ' on / ' + nodes.length
    : '';

  if (!nodes.length) {
    el.innerHTML = '<div class="note">No boards on the bench.<br><br>'
      + 'Add some below. Each one announces itself to <b>/devices</b> exactly as a '
      + 'real ESP32 does, so it turns up in the app’s <i>Link a node</i> list '
      + 'within about 30 seconds.</div>';
    return;
  }

  nodes.forEach(function (n) {
    const d = document.createElement('div');
    d.className = 'node' + (selected === n.mac ? ' sel' : '') + (n.on ? '' : ' off');
    const where = n.assignedTo
      ? n.assignedTo.replace('/', ' › ')
      : 'unassigned';
    const dot = n.busy ? 'dot busy' : (n.on ? 'dot on' : 'dot');
    const lastTxt = n.last
      ? n.last.temperature + 'C ' + n.last.humidity + '%'
        + (n.force ? '  FORCED ' + n.force.toUpperCase() : '')
      : (n.on ? 'waiting' : 'powered off');

    d.innerHTML =
      '<span class="' + dot + '"></span>' +
      '<span class="col">' +
        '<div class="id">' + n.mac.slice(-4) + '</div>' +
        '<div class="meta">' + lastTxt + '</div>' +
        '<div class="where">' + where + '</div>' +
      '</span>';

    const pw = document.createElement('button');
    pw.textContent = n.on ? 'off' : 'on';
    pw.style.cssText = 'padding:2px 7px;font-size:11px';
    pw.onclick = function (ev) {
      ev.stopPropagation();
      n.on = !n.on;
      log('t-sys', n.mac.slice(-4) + ' powered ' + (n.on ? 'on' : 'off'));
      save(); renderPool();
      if (n.on) cycleOne(n);
    };
    d.appendChild(pw);

    const rm = document.createElement('button');
    rm.textContent = '×';
    rm.style.cssText = 'padding:2px 7px;font-size:11px';
    rm.onclick = function (ev) { ev.stopPropagation(); removeNode(n.mac); };
    d.appendChild(rm);

    d.onclick = function () {
      selected = (selected === n.mac) ? null : n.mac;
      $('hint').textContent = selected
        ? 'now tap the section board ' + n.mac.slice(-4) + ' goes into'
        : 'pick a node, then tap a section';
      renderPool();
    };
    el.appendChild(d);
  });
}

function renderMap() {
  const el = $('map');
  el.innerHTML = '';
  if (!houseId) { el.style.cssText = ''; el.innerHTML =
      '<div class="note">Pick a house above.</div>'; return; }

  const W = Number(houseMeta && houseMeta.width) || 10;
  const L = Number(houseMeta && houseMeta.length) || 14;
  const px = Math.min(560 / W, 460 / L, 46);
  el.style.width = (W * px) + 'px';
  el.style.height = (L * px) + 'px';

  // The open, sun-facing edge is y = 0 - the same convention the field uses,
  // where shade falls off with depth from that edge.
  const sun = document.createElement('div');
  sun.className = 'sunbar';
  sun.style.top = '-9px';
  sun.title = 'open sun-facing edge';
  el.appendChild(sun);

  const masterMac = houseMeta && houseMeta.masterMac;

  Object.keys(sections).sort().forEach(function (sid) {
    const s = sections[sid];
    const holder = nodes.find(function (n) { return n.assignedTo === houseId + '/' + sid; });
    const d = document.createElement('div');
    d.className = 'sec' + (holder ? ' has' : '')
                + (holder && masterMac === holder.mac ? ' master' : '');
    d.style.left = ((s.x / W) * 100) + '%';
    d.style.top = ((s.y / L) * 100) + '%';
    d.title = sid + '  (' + s.x.toFixed(1) + ', ' + s.y.toFixed(1) + ' m)'
            + (s.readings !== undefined ? '\n' + s.readings + ' readings' : '');
    d.innerHTML =
      '<span class="sid">' + sid + '</span>' +
      (holder
        ? '<span class="nd">' + holder.mac.slice(-4) + '</span>'
          + '<span class="t">' + (holder.last ? holder.last.temperature + 'C' : '…') + '</span>'
        : '<span class="none">no node</span>') +
      (s.readings !== undefined
        ? '<span class="t" style="font-size:9px">' + s.readings + '</span>' : '');

    d.onclick = function () {
      if (selected) { assign(selected, sid); return; }
      if (holder) unassign(holder.mac);
    };
    el.appendChild(d);
  });
}

/* ══════════════════════════════════════ Houses ════════════════════════════ */

async function loadHouses() {
  const hs = await fbGet(farmPath('/houses.json?shallow=true')) || {};
  const ids = Object.keys(hs).sort();
  const sel = $('house');
  sel.innerHTML = '<option value="">— pick —</option>';
  for (const id of ids) {
    const m = await fbGet(farmPath('/houses/' + id + '/meta.json')) || {};
    const o = document.createElement('option');
    o.value = id;
    o.textContent = id + '  ' + (m.name || '') + (m.simulated ? '  [sim]' : '  [REAL]');
    sel.appendChild(o);
  }
  if (houseId && ids.indexOf(houseId) >= 0) sel.value = houseId;
  if (sel.value) await loadHouse(sel.value);
}

async function loadHouse(id) {
  houseId = id || null;
  delete fieldCache[id];
  if (!houseId) { houseMeta = null; sections = {}; renderMap(); return; }

  houseMeta = await fbGet(farmPath('/houses/' + houseId + '/meta.json')) || {};
  const secs = await fbGet(farmPath('/houses/' + houseId + '/sections.json')) || {};
  sections = {};
  Object.keys(secs).forEach(function (sid) {
    const m = (secs[sid] || {}).meta || {};
    sections[sid] = { x: Number(m.x) || 0, y: Number(m.y) || 0, name: m.name || sid };
  });

  const b = $('banner');
  if (!houseMeta.simulated) {
    b.className = 'banner show';
    b.textContent = houseId + ' is NOT marked simulated. Nothing will be written to it. '
      + 'Readings invented into a measured archive cannot be separated out afterwards.';
  } else {
    b.className = 'banner';
  }
  $('claim').disabled = !!houseMeta.simulated;
  save(); renderMap(); refreshCal(); fillScenario();
}

async function claimHouse() {
  if (!houseId) return;
  if (houseId === 'H1') {
    alert('H1 is the real house with real plants and real sensors.\n'
        + 'It will not be marked simulated from here.');
    return;
  }
  if (!confirm('Mark ' + houseId + ' as simulated?\n\n'
      + 'Everything written to it from then on is invented, and it should never '
      + 'be used as evidence of anything the hardware did.')) return;
  await fbPatch(farmPath('/houses/' + houseId + '/meta.json'), { simulated: true });
  log('t-sys', houseId + ' marked simulated');
  await loadHouses();
}

/* ══════════════════════════════════════ Wiring ════════════════════════════ */

$('add').onclick = function () {
  const k = Math.max(1, Math.min(40, Number($('mk').value) || 1));
  for (let i = 0; i < k; i++) {
    nodes.push({
      mac: newMac(), on: true,
      ip: '192.168.1.' + (100 + Math.floor(Math.random() * 130)),
      ssid: 'OrchidFarm', rssi: -(45 + Math.floor(Math.random() * 35)),
      assignedTo: null, busy: false, last: null, lastCmdId: null, force: null
    });
  }
  save(); renderPool();
  log('t-sys', k + ' board(s) added; they announce on the next cycle');
  nodes.slice(-k).forEach(function (n) { cycleOne(n); });
};

$('wipe').onclick = async function () {
  if (!nodes.length) return;
  /* DELETE THE RECORDS, not just this list.
     This used to clear the bench and leave every /devices record behind, with a
     confirm box that explained as much - which is not a fix, it is a warning
     label on a trap. Sessions accumulated: 74 device records existed on 31 Aug
     against 8 boards actually running, so the app's Link-a-node list was mostly
     boards that had not existed for half a day, and picking one would assign a
     section to a board that would never report.
     A virtual board that has been forgotten has no reason to exist anywhere. */
  if (!confirm('Remove all ' + nodes.length + ' boards on this bench?\n\n'
      + 'They are unlinked from their sections and deleted from /devices, so they '
      + 'stop appearing in the app. Real hardware is never touched - only boards '
      + 'this bench created.')) return;

  const doomed = nodes.slice();
  nodes = []; selected = null; save(); renderPool(); renderMap();
  let gone = 0;
  for (const n of doomed) {
    try {
      if (n.assignedTo) {
        const parts = n.assignedTo.split('/');
        await fbDelete('/devices/' + n.mac + '/assignedTo.json');
        await fbDelete(farmPath('/houses/' + parts[0] + '/sections/' + parts[1] + '/deviceMac.json'));
      }
      await fbDelete('/devices/' + n.mac + '.json');
      await fbDelete(farmPath('/masters/' + n.mac + '.json'));
      gone++;
    } catch (e) {
      log('t-err', 'could not remove ' + n.mac.slice(-4) + ': ' + e.message);
    }
  }
  log('t-sys', gone + ' board(s) removed from /devices - they will stop showing in the app');
};

function setForce(kind) {
  const n = nodes.find(function (x) { return x.mac === selected; });
  if (!n) { log('t-err', 'Pick a node first, then force it.'); return; }
  if (!n.assignedTo) { log('t-err', n.mac.slice(-4) + ' is not in a section yet.'); return; }
  n.force = kind;
  log(kind ? 't-sys' : 't-ok',
      n.mac.slice(-4) + ' -> ' + (kind ? kind.toUpperCase() + ': ' + FORCE[kind].why
                                       : 'back to the simulated field'));
  renderPool();
  cycleOne(n);          // report it immediately rather than on the next cycle
}
$('fNormal').onclick = function () { setForce(null); };
$('fDry').onclick    = function () { setForce('dry'); };
$('fHot').onclick    = function () { setForce('hot'); };

/* ═══════════════════ Talking to the backend ═══════════════════════════════
   Everything else on this bench writes to Firebase directly, the way a node
   does. These calls do not: they ask the BACKEND to decide, because deciding
   is the thing being rehearsed.

   The key is TYPED BY THE OPERATOR and kept in this browser. This file lives in
   a public repository and a key committed to one has already had to be rotated
   once on this project. */
const API = 'https://orchidfarm.duckdns.org/api/v2';

function apiKey() {
  let k = null;
  try { k = localStorage.getItem('orchidApiKey'); } catch (e) { /* private window */ }
  if (!k) {
    k = prompt('Backend API key (kept in this browser only, never in the file):');
    if (!k) return null;
    try { localStorage.setItem('orchidApiKey', k.trim()); } catch (e) { /* ignore */ }
  }
  return k.trim();
}

async function api(method, path) {
  const k = apiKey();
  if (!k) throw new Error('no API key');
  const r = await fetch(API + path, { method: method, headers: { 'X-API-Key': k } });
  let j = null;
  try { j = await r.json(); } catch (e) { /* empty body */ }
  if (!r.ok) throw new Error((j && j.detail) ? j.detail : (method + ' ' + path + ' -> ' + r.status));
  return j;
}

/* Farm local time as the backend wants it. `at` is read as FARM time, and the
   farm is UTC+5:30 with no DST, so this is built from the browser's own clock
   shifted onto that offset rather than from toISOString(), which would hand the
   engine a UTC hour and plan a 06:47 watering for the middle of the night. */
const FARM_OFFSET_MIN = 330;
function farmNow(plusMinutes) {
  const d = new Date(Date.now() + (plusMinutes || 0) * 60000);
  return new Date(d.getTime() + (FARM_OFFSET_MIN + d.getTimezoneOffset()) * 60000);
}
function stamp(d) {
  const p = function (v) { return String(v).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function runEngine(at, why) {
  log('t-cmd', 'engine pass' + (at ? ' as if it were ' + at : ' now')
      + (why ? '  (' + why + ')' : '') + '...');
  const j = await api('POST', '/auto/engine/run-now' + (at ? '?at=' + encodeURIComponent(at) : ''));
  log('t-ok', 'engine ran at ' + j.at);

  /* The engine is multi-tenant now, so `did` arrives keyed by tenant:
       { t_abc: { plan: {...}, tray: {...}, water: {...} } }
     rather than the flat { plan, tray, water } it used to be. The callers below
     read `did.water` and `did.tray`, and against the nested shape those are
     simply undefined - so every scenario would report "nothing fired" while the
     backend had in fact watered. A false negative in the one tool whose whole
     job is telling you whether the farm reacted.

     Flattened here rather than at each call site, and tolerant of both shapes so
     this page still works against a backend from before the cutover. */
  const raw = j.did || {};
  const d = {};
  const nested = Object.keys(raw).filter(function (k) {
    return k.indexOf('t_') === 0 && raw[k] && typeof raw[k] === 'object';
  });
  if (!nested.length) {
    Object.assign(d, raw);                       // pre-cutover: already flat
  } else {
    nested.forEach(function (tid) {
      log('t-dim', '   tenant ' + tid + ':');
      Object.keys(raw[tid] || {}).forEach(function (step) {
        // One bench drives one farm, so merging is safe and keeps the callers
        // below unchanged. If two tenants ever both act in one pass, the log
        // above still shows each separately.
        d[step] = raw[tid][step];
      });
    });
  }
  Object.keys(d).forEach(function (step) {
    log('t-dim', '   ' + step + ': ' + JSON.stringify(d[step]).slice(0, 200));
  });
  return d;
}

$('runNow').onclick = async function () {
  // Same reach as the scenario buttons, so the same check. It runs at the real
  // minute rather than a pretend one, which makes it likelier to be harmless -
  // not guaranteed to be.
  try {
    const risk = await realRisk(farmNow(), 'water');
    if (risk.length) {
      log('t-err', 'REFUSED: a pass right now would water a REAL section:');
      risk.forEach(function (r) { log('t-err', '   ' + r); });
      return;
    }
    await runEngine(null, null);
  } catch (e) {
    log('t-err', 'engine: ' + e.message);
  }
};

/* ═══════════════════ Scenarios ════════════════════════════════════════════
   Six manual steps stood between "I want to see the alarm" and seeing it: link
   a node, wait for a reading, plan the section by hand because the engine plans
   only once a day, read the planned hour back, type it into a prompt, and know
   that 20 minutes is the window. Every one of those is a place to get it wrong,
   and getting it wrong looks identical to the feature being broken - which is
   how a whole night went into "the alarm did not fire".

   THIS DOES NOT TOUCH `control.override`. Whether a section alarms or pours is
   the farm's decision, and a bench that quietly flipped it would be rehearsing
   its own setting rather than the farm's. It is READ and shown instead, so the
   button says what is about to happen before it is pressed. */

function fillScenario() {
  const sel = $('scSec');
  const keep = sel.value;
  const ids = Object.keys(sections).sort(function (a, b) {
    const na = parseInt(String(a).replace(/\D/g, ''), 10) || 0;
    const nb = parseInt(String(b).replace(/\D/g, ''), 10) || 0;
    return na - nb;
  });
  sel.innerHTML = ids.map(function (sid) {
    return '<option value="' + sid + '">' + sid + '  ' + (sections[sid].name || '') + '</option>';
  }).join('');
  if (ids.indexOf(keep) >= 0) sel.value = keep;
  showMode();
}

/* What the farm will do with this section, read from the farm itself.
   `override` is 'auto' | 'manual' | absent, and absent means follow the farm
   switch - the same three-way the backend applies in section_acts_alone(). */
async function showMode() {
  const el = $('scMode');
  const sid = $('scSec').value;
  if (!houseId || !sid) { el.textContent = '—'; return; }
  const ov = await fbGet(farmPath('/houses/' + houseId + '/sections/' + sid + '/control/override.json'));
  const farm = await fbGet(farmPath('/meta/autoMode.json'));
  const alone = ov === 'auto' ? true : ov === 'manual' ? false : !!farm;
  el.textContent = (ov ? 'override ' + ov : 'farm ' + (farm ? 'auto' : 'off'))
                 + (alone ? '  -> POURS' : '  -> ALARMS');
  el.style.color = alone ? '#7fd4a2' : '#e0b44a';
  return alone;
}

/* Which REAL sections could this pass command?
 *
 * `simulated: true` is the same flag the writing guard uses, so a house is
 * either the bench's to play with or it is somebody's plants. There is no
 * middle case and this deliberately does not invent one.
 *
 * `kind` is 'water' or 'tray'. Watering is decided from data this function can
 * read, so it answers precisely. The tray is decided by a model from the live
 * reading, so it does not guess - it returns every section that is eligible and
 * lets the operator decide.
 */
const WATER_WINDOW_MIN = 20;      // _due_sessions in automation.py

async function realRisk(at, kind) {
  const houses = await fbGet(farmPath('/houses.json')) || {};
  const farmAuto = !!(await fbGet(farmPath('/meta/autoMode.json')));
  const day = at.getFullYear() + '-' + String(at.getMonth() + 1).padStart(2, '0')
            + '-' + String(at.getDate()).padStart(2, '0');
  const mins = at.getHours() * 60 + at.getMinutes();
  const risk = [];

  Object.keys(houses).forEach(function (hid) {
    const h = houses[hid] || {};
    if (((h.meta || {}).simulated) === true) return;        // the bench's own
    const secs = h.sections || {};
    Object.keys(secs).forEach(function (sid) {
      const sec = secs[sid] || {};
      const ctrl = sec.control || {};
      // section_acts_alone(): an override wins over the farm switch, absent
      // means follow it. Only a section that acts ALONE opens a valve; one that
      // alarms instead is harmless here.
      const alone = ctrl.override === 'auto' ? true
                  : ctrl.override === 'manual' ? false : farmAuto;
      if (!alone) return;
      const name = (h.meta || {}).name || hid;

      if (kind === 'water') {
        const plan = sec.plan || {};
        if (plan.date !== day || !plan.waterTime) return;
        const hm = String(plan.waterTime).split(':');
        const due = Number(hm[0]) * 60 + Number(hm[1]);
        if (mins < due || mins > due + WATER_WINDOW_MIN) return;
        const log = (sec.watering || {}).log || {};
        if (log[day + '-first']) return;                    // _already_done
        risk.push(hid + '/' + sid + ' (' + name + ') is due at ' + plan.waterTime
                  + ' for ' + plan.durationSec + 's');
      } else {
        if (ctrl.trayEnabled === false) return;
        risk.push(hid + '/' + sid + ' (' + name + ') tray is automatic');
      }
    });
  });
  return risk;
}

/* PLAN, THEN RUN AT THE PLANNED MINUTE.
   The engine plans once a day (lastPlanDay) and skips any section that had no
   reading at the time, so a section whose node came online at 06:24 gets no
   plan at all and the watering link has nothing to fire on - which is not a
   failure anyone can see, because an absent plan produces an absent alarm.
   The per-section endpoint has no such guard, so it is used to make one.

   The pass is then asked to pretend it is one minute past the planned time.
   `_due_sessions` accepts a session from its minute until 20 minutes later, so
   +1 lands safely inside without depending on how long the plan call took. */
async function scWater() {
  const sid = $('scSec').value;
  if (!houseId || !sid) { log('t-err', 'Pick a house and a section first.'); return; }
  const alone = await showMode();
  try {
    log('t-cmd', 'planning ' + houseId + '/' + sid + '...');
    const j = await api('POST', '/care/houses/' + houseId + '/sections/' + sid + '/plan');
    const plan = j.plan || j;
    if (!plan.waterTime) {
      log('t-err', 'no waterTime in the plan - the section probably has no reading yet');
      return;
    }
    log('t-ok', 'plan ' + plan.waterTime + ' for ' + plan.durationSec + 's'
        + (plan.litres ? '  (' + plan.litres + ' L)' : ''));

    const hm = String(plan.waterTime).split(':');
    const at = farmNow();
    at.setHours(Number(hm[0]), Number(hm[1]) + 1, 0, 0);

    // The pass is farm-wide. Refuse rather than water somebody's plants.
    const risk = await realRisk(at, 'water');
    if (risk.length) {
      log('t-err', 'REFUSED: a pass at ' + stamp(at) + ' would also water a REAL '
          + 'section, because run-now evaluates the whole farm:');
      risk.forEach(function (r) { log('t-err', '   ' + r); });
      log('t-dim', 'Wait until that window has passed, or water it from the app '
          + 'first so the day is logged, then try again.');
      return;
    }

    const did = await runEngine(stamp(at), 'the planned minute');

    const w = did.water || {};
    const key = houseId + '-' + sid;
    const hit = function (list) {
      return (list || []).some(function (k) { return k.indexOf(key) === 0; });
    };
    if (hit(w.alarmed)) log('t-ok', 'ALARM raised - check the phone');
    else if (hit(w.watered)) log('t-ok', 'watered - the node should be pouring now');
    else log('t-err', 'nothing fired for ' + key + '. Already done today? '
                    + 'watering/log holds one entry per day per session.');
  } catch (e) {
    log('t-err', 'watering scenario: ' + e.message);
  }
}

/* The tray decision is made from the CURRENT reading, so force the node Dry or
   Hot first or a comfortable section will correctly ask for nothing.

   Runs the ENGINE rather than /tray-check, and the difference matters:
   /tray-check decides and acts, but the ALARM is raised by run_tray_cycle, so
   calling the endpoint would show the decision and never produce the alarm this
   button exists to produce. The pass is dated 16 minutes ahead because the
   engine checks trays every 15 and would otherwise skip the cycle entirely. */
async function scTray() {
  const sid = $('scSec').value;
  if (!houseId || !sid) { log('t-err', 'Pick a house and a section first.'); return; }
  await showMode();
  const holder = nodes.find(function (n) { return n.assignedTo === houseId + '/' + sid; });
  if (holder && !holder.force) {
    log('t-dim', 'note: ' + holder.mac.slice(-4) + ' is not forced. A comfortable '
        + 'section asks for no fill - press Dry first if nothing happens.');
  }
  try {
    const at = farmNow(16);
    const h = at.getHours();
    if (h < 6 || h > 18) {
      log('t-err', 'the tray is never filled outside 06:00-18:00 farm time (now '
          + stamp(at) + ') - the engine will skip it');
    }
    /* No precise check is possible here: the fill is decided by a model from
       the live reading, and this page cannot run it. So it says exactly what it
       does not know, lists what is exposed, and asks. */
    const risk = await realRisk(at, 'tray');
    if (risk.length) {
      log('t-err', 'A tray pass covers the WHOLE farm, and whether a real tray '
          + 'fills is decided by the model from its own reading - this page '
          + 'cannot know in advance.');
      risk.forEach(function (r) { log('t-err', '   ' + r); });
      if (!confirm('This runs the tray cycle for the WHOLE farm, including '
          + risk.length + ' real section(s):\n\n  ' + risk.join('\n  ')
          + '\n\nWhether their valves open is the model\'s decision from their '
          + 'own readings, so it cannot be predicted here. Real pumps may run.\n\n'
          + 'Continue?')) {
        log('t-sys', 'tray pass cancelled - nothing was sent');
        return;
      }
      log('t-sys', 'operator accepted the farm-wide tray pass');
    }

    const did = await runEngine(stamp(at), 'past the 15 min tray guard');
    const t = did.tray || {};
    const key = houseId + '-' + sid;
    if ((t.alarmed || []).some(function (k) { return k === key; }))
      log('t-ok', 'TRAY ALARM raised - check the phone');
    else
      log('t-dim', 'no tray alarm for ' + key + '. Either it filled automatically, '
                 + 'it is in cooldown, or the model asked for nothing.');
  } catch (e) {
    log('t-err', 'tray scenario: ' + e.message);
  }
}

$('scSec').onchange = showMode;
$('scWater').onclick = scWater;
$('scTray').onclick = scTray;

/* Persisted exactly the way the API key is (see apiKey() below): kept only in
   this browser's localStorage, read once at load, saved back on change.
   Default empty - see the guard in fb(), which refuses to write without it. */
try { $('tenant').value = localStorage.getItem('orchidTenant') || ''; }
catch (e) { /* private window; the bench still works, it just forgets */ }
$('tenant').onchange = function () {
  const v = this.value.trim();
  this.value = v;
  try { localStorage.setItem('orchidTenant', v); } catch (e) { /* ignore */ }
  log('t-sys', v ? ('tenant set to ' + v) : 'tenant cleared - farm writes will be refused');
};

$('house').onchange = function () { loadHouse(this.value); };
$('claim').onclick = claimHouse;
$('skip').onclick = skipToReady;
$('clr').onclick = function () { $('log').innerHTML = ''; };

$('unassignAll').onclick = async function () {
  const mine = nodes.filter(function (n) {
    return n.assignedTo && n.assignedTo.split('/')[0] === houseId;
  });
  if (!mine.length) return;
  if (!confirm('Unlink ' + mine.length + ' node(s) from ' + houseId + '?')) return;
  for (const n of mine) await unassign(n.mac);
};

$('run').onchange = function () {
  log('t-sys', this.checked ? 'bench running' : 'bench stopped');
  $('stat').textContent = this.checked ? 'running' : 'idle';
};

/* Two loops at two rates, matching the firmware: commands are polled every two
   seconds so a pour starts when the button is pressed, readings go up on the
   node's own read interval. */
setInterval(function () { if ($('run').checked) tick(); }, 2000);
setInterval(function () { if ($('run').checked) fullCycle(); }, 1000);

restore();
renderPool();
loadHouses();
log('t-sys', 'bench ready — ' + FB);
log('t-dim', 'Do not run backend/scripts/sim_farm.py against the same house at '
    + 'the same time, and do not open this page in two tabs.');
</script>
